<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061d31"><title>텐링 · 양궁 챌린지</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b2b;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;overscroll-behavior:none}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}#app{position:fixed;inset:0}#hud{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:14px 14px 0;pointer-events:none} .pill{background:#092339df;border:1px solid #8fbbd14d;box-shadow:0 5px 22px #0414228c;border-radius:14px;padding:9px 13px;font-size:13px;font-weight:700;backdrop-filter:blur(10px)}.pill strong{display:block;font-size:21px;letter-spacing:.3px}.pill small{font-weight:600;color:#a9c4d4;font-size:10px}.hudright{text-align:right}#bottom{position:absolute;bottom:env(safe-area-inset-bottom,0);left:0;right:0;padding:0 16px 17px;pointer-events:none}#hint{text-align:center;font-size:14px;font-weight:800;text-shadow:0 2px 8px #061824;margin-bottom:10px}#scores{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;max-width:600px;margin:auto} .score{height:38px;border-radius:8px;background:#0e2944ce;border:1px solid #ffffff2e;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:14px;font-weight:850;line-height:1.2}.score small{font-size:9px;font-weight:600;color:#acc9da}.score.current{border-color:#fbe16a;box-shadow:0 0 0 1px #ebcc5b}.score.good{color:#f7df83}.score.bad{color:#d3e4fa}#overlay{position:absolute;inset:0;background:#041727c9;display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(6px)}#overlay[hidden]{display:none} .modal{width:min(100%,420px);padding:30px 23px;background:linear-gradient(150deg,#183b57,#0b2035);border:1px solid #8eb5cf69;border-radius:24px;text-align:center;box-shadow:0 22px 60px #0009}.modal .emoji{font-size:44px}.modal h1{font-size:27px;margin:8px 0 12px}.modal p{color:#cfe0ec;font-size:14px;line-height:1.8;margin:6px 0 18px}.modal .summary{font-size:16px;line-height:2}.modal .summary b{color:#ffdc64}button{appearance:none;background:linear-gradient(#ffe891,#f3b940);color:#20252d;border:0;border-radius:15px;padding:14px 27px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #a57227;cursor:pointer;width:100%}#sound{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 103px);width:39px;height:39px;padding:5px;font-size:19px;background:#0b2946b9;box-shadow:none;color:#fff;border:1px solid #ffffff30;border-radius:50%}#sound[hidden]{display:none}#toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:34px;font-weight:950;text-shadow:0 3px 10px #062036,0 0 22px #0008;pointer-events:none;opacity:0;transition:opacity .15s}#toast.show{opacity:1} .note{color:#bed1dc;font-size:11px;margin:12px 0 0}</style></head><body><div id="app"><canvas id="scene"></canvas><div id="hud"><div class="pill"><small>🏹 TEN RING</small><strong id="round">1 / 12</strong></div><div class="pill"><small>바람 WIND</small><strong id="wind">→ 0.0</strong></div><div class="pill hudright"><small>합계 TOTAL</small><strong id="total">0점</strong></div></div><button id="sound" aria-label="효과음 켜기 또는 끄기">🔊</button><div id="toast"></div><div id="bottom"><div id="hint">화면 아래쪽을 누른 채 움직여 조준하세요</div><div id="scores"></div></div><div id="overlay"><div class="modal"><div class="emoji">🎯</div><h1 id="modalTitle">텐링 양궁 챌린지</h1><p id="modalDesc">화면 아래쪽을 누르고 움직여 과녁에 조준하세요.<br><b>손가락을 떼는 순간 발사!</b><br>바람의 방향과 세기를 읽고 조준점을 보정하세요.<br>중앙만 겨냥하면 고득점이 보장되지 않아요.</p><div id="modalSummary" class="summary" hidden></div><button id="start">게임 시작</button><div class="note">점수는 직접 활동지에 기록</div></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}), overlay=document.getElementById('overlay'),start=document.getElementById('start'),hint=document.getElementById('hint'),toast=document.getElementById('toast'),scoresEl=document.getElementById('scores'),windEl=document.getElementById('wind'),roundEl=document.getElementById('round'),totalEl=document.getElementById('total'),snd=document.getElementById('sound');
let W=360,H=720,DPR=1,playing=false,phase='ready',drag=null,aim={x:0,y:0},shots=[],marks=[],wind=0,shot=null,impactAt=0,toastUntil=0,frame=0,audioOn=true,ac=null,validUntil=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
function resize(){let r=canvas.getBoundingClientRect(); W=r.width;H=r.height;DPR=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)} addEventListener('resize',resize);resize();
function newWind(){wind=Math.round(rnd(-3.8,3.8)*10)/10;if(Math.abs(wind)<.9)wind=wind<0?-1.0:1.0;windEl.textContent=(wind>0?'→ ':'← ')+Math.abs(wind).toFixed(1)}
function rebuild(){scoresEl.innerHTML='';for(let i=0;i<12;i++){let e=document.createElement('div');e.className='score'+(i===shots.length&&playing?' current':'')+(shots[i]!==undefined?(shots[i]>=9?' good':' bad'):'');e.innerHTML='<small>'+(i+1)+'발</small>'+(shots[i]===undefined?'·':shots[i]);scoresEl.appendChild(e)}roundEl.textContent=Math.min(shots.length+1,12)+' / 12';totalEl.textContent=shots.reduce((s,v)=>s+v,0)+'점'}
function newGame(){shots=[];marks=[];aim={x:0,y:0};shot=null;drag=null;phase='ready';playing=true;overlay.hidden=true;hint.textContent='아래쪽을 누른 채 움직여 조준 · 놓으면 발사';newWind();rebuild();try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sound(freq,duration,type='sine',gain=.04){if(!audioOn||!ac)return;let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.45),t+duration);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration)}
function geom(){// Fixed target, physical-looking scene. Smaller on narrow screens.
let R=Math.min(W*.285,H*.174,124);return {x:W*.50,y:H*.398,r:R};}
function aimPx(){let g=geom();return{x:g.x+aim.x*g.r,y:g.y+aim.y*g.r}}
function hitScore(x,y){let d=Math.hypot(x,y);if(d>1)return 0;return clamp(10-Math.floor(d*10),1,10)}
function fire(){if(phase!=='aiming'||!playing)return;phase='flight';drag=null;let g=geom(); // impact displacement is tied to displayed wind and aim, no arbitrary scoring
let wobbleX=rnd(-.020,.020),wobbleY=rnd(-.020,.020);
let hx=aim.x+wind*.088+wobbleX,hy=aim.y+.070+wobbleY;let value=hitScore(hx,hy);
shot={sx:W*.49,sy:H*.87,ex:g.x+hx*g.r,ey:g.y+hy*g.r,hx,hy,value,start:performance.now(),duration:570};
hint.textContent='화살이 날아가는 중…';sound(530,.12,'sawtooth',.035);if(navigator.vibrate)navigator.vibrate(20)}
function finish(){if(!shot)return;let s=shot;marks.push({x:s.hx,y:s.hy,v:s.value});shots.push(s.value);shot=null;phase='impact';impactAt=performance.now();toast.textContent=s.value===10?'🎯 PERFECT · 10점':s.value===0?'과녁 밖 · 0점':s.value+'점!';toast.classList.add('show');toastUntil=impactAt+820;sound(s.value>=9?740:380,.18,'sine',.06);rebuild();hint.textContent=shots.length===12?'12발 완료!':'다음 화살을 준비하세요';}
function endRound(){playing=false;phase='done';document.getElementById('modalTitle').textContent='12발 도전 완료!';document.getElementById('modalDesc').innerHTML='12발의 점수를 활동지에 옮겨 적어 보세요.<br>평균·분산·표준편차는 직접 계산!';let sum=shots.reduce((s,x)=>s+x,0),summary=document.getElementById('modalSummary');summary.hidden=false;summary.innerHTML='<div style="font-size:28px"><b>'+sum+'점</b> / 120점</div><div style="font-size:14px">'+shots.map((s,i)=>`${i+1}발 ${s}점`).join(' · ')+'</div>';start.textContent='다시 도전';overlay.hidden=false}
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,fill,stroke=null,sw=1){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.stroke()}}
function drawEnvironment(t){let g=geom();let h=H*.58;
let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#4b9ecb');sky.addColorStop(.75,'#b2deed');sky.addColorStop(1,'#f1e2bd');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// distant hills and tree line, grounded fixed archery field
ctx.beginPath();ctx.moveTo(0,h*.89);for(let x=0;x<=W+10;x+=9)ctx.lineTo(x,h*.87-Math.sin(x*.014)*10-Math.sin(x*.039)*6);ctx.lineTo(W,h+20);ctx.lineTo(0,h+20);ctx.fillStyle='#4c8464';ctx.fill();
ctx.fillStyle='#388351';ctx.fillRect(0,h,W,H-h);let ground=ctx.createLinearGradient(0,h,0,H);ground.addColorStop(0,'#60a16b');ground.addColorStop(1,'#174f39');ctx.fillStyle=ground;ctx.fillRect(0,h,W,H-h);
// Perspective lane converging behind target
ctx.beginPath();ctx.moveTo(g.x-12,h);ctx.lineTo(-W*.18,H);ctx.lineTo(W*1.18,H);ctx.lineTo(g.x+12,h);ctx.closePath();ctx.fillStyle='#b5bb84';ctx.fill();
ctx.beginPath();ctx.moveTo(g.x-8,h);ctx.lineTo(W*.04,H);ctx.lineTo(W*.96,H);ctx.lineTo(g.x+8,h);ctx.closePath();ctx.fillStyle='#80a46a';ctx.fill();
for(let i=0;i<5;i++){let q=i/5,y=h+(H-h)*q*q;line(0,y,W,y,'#f3ecbe'+(i>2?'28':'18'),1+q)}
// behind target stand
rounded(g.x-g.r*.68,g.y+g.r*.42,g.r*1.36,g.r*.88,3,'#647b71');line(g.x-g.r*.67,g.y+g.r*.76,g.x-g.r*.76,g.y+g.r*1.36,'#293a36',4);line(g.x+g.r*.67,g.y+g.r*.76,g.x+g.r*.76,g.y+g.r*1.36,'#293a36',4);
}
function drawTarget(){let g=geom(),cols=['#f4f2e4','#151a24','#298cc6','#e74335','#f3d445'];for(let i=0;i<5;i++)circle(g.x,g.y,g.r*(1-i*.2),cols[i],'#1e2633',1.15);circle(g.x,g.y,g.r*.045,'#e8a527'); // ring division each of ten
for(let i=1;i<=9;i++)circle(g.x,g.y,g.r*(1-i/10),null,'#fff9',.6);
ctx.font=`${Math.max(9,g.r*.095)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#101b26';ctx.fillText('10',g.x,g.y-g.r*.092);
for(let m of marks){let x=g.x+m.x*g.r,y=g.y+m.y*g.r;circle(x,y,3.7,'#181f2a','#f4f5ed',1);line(x-5,y-5,x+4,y+3,'#2e3845',1.6)} }
function drawCrosshair(now){let g=geom(),p=aimPx(),w=(phase==='aiming'?1:0);let sway=(w?Math.sin(now*.0015)*.011:0);let x=p.x+sway*g.r,y=p.y+(w?Math.cos(now*.0019)*.011*g.r:0);
let c=phase==='aiming'?'#fff6a7':'#f7fbfa';ctx.save();ctx.shadowColor='#0c253f';ctx.shadowBlur=5;circle(x,y,Math.max(10,g.r*.125),null,c,2);line(x-24,y,x-12,y,c,2);line(x+12,y,x+24,y,c,2);line(x,y-24,x,y-12,c,2);line(x,y+12,x,y+24,c,2);circle(x,y,1.8,c);ctx.restore()}
function drawTouchZone(){if(!playing||phase==='flight'||phase==='impact')return;let cy=H*.75,R=Math.min(W*.20,66);let active=phase==='aiming';circle(W*.5,cy,R,active?'#092a4488':'#0c2c4782','#fff7',1.6);circle(W*.5,cy,R*.67,null,'#fff4',1);
let px=W*.5+(active?clamp(aim.x,-.75,.75)*R*.65:0),py=cy+(active?clamp(aim.y,-.75,.75)*R*.65:0);circle(px,py,17,active?'#ffda66':'#dcecf2','#fff',2);ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillStyle='#fff';ctx.fillText(active?'놓으면 발사':'여기를 누르고 조준',W*.5,cy-R-14);
}
function drawFlight(now){if(!shot)return;let g=geom(),s=shot,t=clamp((now-s.start)/s.duration,0,1),k=1-Math.pow(1-t,2.1),x=lerp(s.sx,s.ex,k),y=lerp(s.sy,s.ey,k)-Math.sin(Math.PI*t)*H*.045;
// arrow from camera into distance; shaft progressively foreshortens and narrows
let len=lerp(Math.min(H*.115,85),7,k),lw=lerp(6,1.2,k);
ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(s.ey-s.sy,s.ex-s.sx)+Math.PI/2);line(0,len*.65,0,-len*.34,'#eff3f2',lw);line(0,len*.65,0,-len*.34,'#424d57',Math.max(.5,lw*.36));ctx.fillStyle='#dedfe2';ctx.beginPath();ctx.moveTo(0,-len*.56);ctx.lineTo(-lw*.65,-len*.31);ctx.lineTo(lw*.65,-len*.31);ctx.closePath();ctx.fill();ctx.fillStyle='#e63b43';ctx.beginPath();ctx.moveTo(0,len*.48);ctx.lineTo(-lw*1.8,len*.64);ctx.lineTo(0,len*.28);ctx.lineTo(lw*1.8,len*.64);ctx.fill();ctx.restore();if(t>=1)finish()}
function draw(now){frame=now;drawEnvironment(now);drawTarget();if(playing&&phase!=='flight')drawCrosshair(now);drawFlight(now);drawTouchZone();if(toastUntil&&now>toastUntil){toast.classList.remove('show');toastUntil=0;if(phase==='impact'){if(shots.length>=12)endRound();else{phase='ready';newWind();hint.textContent='아래쪽을 누르고 움직여 조준 · 놓으면 발사';rebuild()}}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function setAim(dx,dy){const g=geom();aim.x=clamp(drag.ax+dx/(g.r*1.28),-1.25,1.25);aim.y=clamp(drag.ay+dy/(g.r*1.28),-1.25,1.25)}
canvas.addEventListener('pointerdown',e=>{if(!playing||phase!=='ready'||e.clientY<H*.49)return;e.preventDefault();if(drag)return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,ax:aim.x,ay:aim.y};phase='aiming';hint.textContent='손가락을 움직여 조준한 뒤 놓으면 발사';sound(180,.05,'triangle',.012)});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||phase!=='aiming')return;e.preventDefault();setAim(e.clientX-drag.x,e.clientY-drag.y)});
canvas.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();if(phase==='aiming'){setAim(e.clientX-drag.x,e.clientY-drag.y);fire()}});
canvas.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){drag=null;if(phase==='aiming'){phase='ready';hint.textContent='조준이 취소됐어요. 다시 눌러주세요'}}});
start.addEventListener('click',newGame);snd.addEventListener('click',()=>{audioOn=!audioOn;snd.textContent=audioOn?'🔊':'🔇'});rebuild();
})();
</script></body></html>
